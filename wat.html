<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tilt Water — 傾き水面シミュレーション</title>
<style>
  :root{
    --bg-top:#060b14;
    --bg-bottom:#0c1c24;
    --glass-rim:rgba(180,220,230,0.35);
    --ink:#dfeef2;
    --ink-dim:#7fa3ad;
    --accent:#63e6d4;
    --accent-dim:rgba(99,230,212,0.15);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% -10%, #10222c 0%, var(--bg-top) 45%, var(--bg-bottom) 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  .stage{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));
  }
  header{
    text-align:center;
    margin-bottom:14px;
    flex:0 0 auto;
  }
  h1{
    margin:0;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.06em;
    color:var(--ink);
  }
  p.sub{
    margin:4px 0 0;
    font-size:12px;
    color:var(--ink-dim);
    letter-spacing:0.03em;
  }
  .glass-wrap{
    position:relative;
    width:min(92vw, 92vh, 460px);
    height:min(70vh, 92vw, 640px);
    flex:1 1 auto;
    max-height:640px;
  }
  .glass{
    position:relative;
    width:100%;
    height:100%;
    border-radius:34px;
    overflow:hidden;
    background:#04141a;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.65),
      inset 0 0 0 1.5px var(--glass-rim),
      inset 0 2px 18px rgba(0,0,0,0.55);
  }
  canvas#water{
    display:block;
    width:100%;
    height:100%;
  }
  .glass::before{
    /* 表面の反射ハイライト（ガラスの質感） */
    content:"";
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    pointer-events:none;
    background:
      radial-gradient(60% 30% at 22% 8%, rgba(255,255,255,0.22), rgba(255,255,255,0) 70%),
      linear-gradient(115deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 30%);
    mix-blend-mode:screen;
    z-index:3;
  }
  .glass::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
    border-radius:34px;
    z-index:3;
  }
  footer{
    flex:0 0 auto;
    margin-top:14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .tilt-badge{
    font-size:11px;
    color:var(--ink-dim);
    letter-spacing:0.03em;
    min-width:120px;
    text-align:center;
    font-variant-numeric:tabular-nums;
  }
  button.reset{
    appearance:none;
    border:1px solid rgba(127,163,173,0.4);
    background:rgba(255,255,255,0.03);
    color:var(--ink-dim);
    font-size:12px;
    letter-spacing:0.03em;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
  }
  button.reset:active{ background:rgba(255,255,255,0.09); }

  .overlay{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(4,10,16,0.72);
    backdrop-filter:blur(6px);
    z-index:10;
    transition:opacity .5s ease;
  }
  .overlay.hidden{ opacity:0; pointer-events:none; }
  .start-btn{
    appearance:none;
    border:none;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding:26px 34px;
    border-radius:22px;
    background:linear-gradient(180deg, rgba(99,230,212,0.14), rgba(99,230,212,0.05));
    border:1px solid rgba(99,230,212,0.4);
    color:var(--ink);
    box-shadow:0 0 40px rgba(99,230,212,0.12);
  }
  .start-btn .icon{
    width:34px; height:34px;
    border-radius:50%;
    border:1.5px solid var(--accent);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);
    font-size:16px;
  }
  .start-btn .label{
    font-size:14px;
    font-weight:600;
    letter-spacing:0.03em;
  }
  .start-btn .desc{
    font-size:11.5px;
    color:var(--ink-dim);
    max-width:220px;
    text-align:center;
    line-height:1.6;
  }
</style>
</head>
<body>

  <div class="stage">
    <header>
      <h1>Tilt Water</h1>
      <p class="sub">スマホを傾けると、水面が本物のように揺れます</p>
    </header>

    <div class="glass-wrap">
      <div class="glass">
        <canvas id="water"></canvas>
      </div>
    </div>

    <footer>
      <button class="reset" id="resetBtn">水面を静める</button>
      <span class="tilt-badge" id="tiltBadge">tilt: 0.00, 0.00</span>
    </footer>
  </div>

  <div class="overlay" id="overlay">
    <button class="start-btn" id="startBtn">
      <span class="icon">▶</span>
      <span class="label" id="startLabel">タップして開始</span>
      <span class="desc" id="startDesc">スマホを傾けると水が揺れます</span>
    </button>
  </div>

<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------
  // 1. Shallow Water Equations（浅水波方程式）による水面シミュレーション
  //    スタッガード格子（MAC grid）で h（水位）, u, v（流速）を保持し、
  //    傾き（重力の水平成分）を u,v の加速度項として与えることで
  //    実際の「コップの水」のような慣性のあるスロッシングを再現する。
  // ---------------------------------------------------------------

  const canvas = document.getElementById('water');
  const ctx = canvas.getContext('2d', { alpha: false });
  const glassEl = document.querySelector('.glass');
  const tiltBadge = document.getElementById('tiltBadge');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const startLabel = document.getElementById('startLabel');
  const startDesc = document.getElementById('startDesc');
  const resetBtn = document.getElementById('resetBtn');

  // 物理定数
  const GRAV = 2.6;        // 波の復元力（大きいほど波が速く伝わる）
  const H0 = 1.0;          // 基準水深
  const DAMPING = 0.9975;  // 減衰（1に近いほど揺れが長く続く）
  const SUBSTEPS = 5;      // 1フレームあたりの物理サブステップ数
  const DT = 0.045;        // サブステップの時間刻み（CFL条件を満たす値）
  const TILT_GAIN = 3.4;   // 傾きが加速度に与える強さ
  const CELL_BUDGET = 7000; // シミュレーション格子の総セル数上限（負荷調整用）

  let W = 0, H = 0;        // グリッド解像度
  let h, u, v;              // Float32Array: 水位 / x方向流速 / y方向流速
  let offCanvas, offCtx, offImage, offData;

  function initSim(){
    const rect = glassEl.getBoundingClientRect();
    const aspect = Math.max(0.3, Math.min(3, rect.width / rect.height));
    let w = Math.round(Math.sqrt(CELL_BUDGET * aspect));
    let hh = Math.round(Math.sqrt(CELL_BUDGET / aspect));
    W = Math.max(24, Math.min(140, w));
    H = Math.max(24, Math.min(140, hh));

    h = new Float32Array(W * H);
    u = new Float32Array((W + 1) * H);
    v = new Float32Array(W * (H + 1));

    offCanvas = document.createElement('canvas');
    offCanvas.width = W;
    offCanvas.height = H;
    offCtx = offCanvas.getContext('2d');
    offImage = offCtx.createImageData(W, H);
    offData = offImage.data;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.imageSmoothingEnabled = true;
    if ('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';
  }

  function resizeAll(){
    initSim();
  }

  // --- 物理ステップ -------------------------------------------------
  function physicsStep(dt, tax, tay){
    const Wp1 = W + 1;

    // u（x方向流速）の更新：水位の勾配 + 傾きによる加速度
    for (let j = 0; j < H; j++){
      const rowU = j * Wp1;
      const rowH = j * W;
      for (let i = 1; i < W; i++){
        const dh = h[rowH + i] - h[rowH + i - 1];
        u[rowU + i] += (-GRAV * dh + tax) * dt;
      }
    }

    // v（y方向流速）の更新
    for (let j = 1; j < H; j++){
      const rowV = j * W;
      const rowH0 = j * W;
      const rowHm1 = (j - 1) * W;
      for (let i = 0; i < W; i++){
        const dh = h[rowH0 + i] - h[rowHm1 + i];
        v[rowV + i] += (-GRAV * dh + tay) * dt;
      }
    }
    // ※ 境界(i=0,W / j=0,H)の速度は更新されないため常に0 → 壁での反射条件を自然に満たす

    // 減衰
    for (let i = 0; i < u.length; i++) u[i] *= DAMPING;
    for (let i = 0; i < v.length; i++) v[i] *= DAMPING;

    // 水位 h の更新（連続の式：速度場の発散から水位変化を求める）
    for (let j = 0; j < H; j++){
      const rowH = j * W;
      const rowU = j * Wp1;
      const rowV0 = j * W;
      const rowV1 = (j + 1) * W;
      for (let i = 0; i < W; i++){
        const divU = u[rowU + i + 1] - u[rowU + i];
        const divV = v[rowV1 + i] - v[rowV0 + i];
        h[rowH + i] += -H0 * (divU + divV) * dt;
      }
    }
  }

  // 波紋（タップ / ドラッグ）を追加
  function addRipple(nx, ny, amp, radius){
    const gi = Math.floor(nx * W);
    const gj = Math.floor(ny * H);
    const r = radius;
    const sigma2 = (r * 0.5) * (r * 0.5);
    for (let dj = -r; dj <= r; dj++){
      const jj = gj + dj;
      if (jj < 0 || jj >= H) continue;
      for (let di = -r; di <= r; di++){
        const ii = gi + di;
        if (ii < 0 || ii >= W) continue;
        const d2 = di * di + dj * dj;
        if (d2 > r * r) continue;
        h[jj * W + ii] += amp * Math.exp(-d2 / (2 * sigma2));
      }
    }
  }

  function resetWater(){
    if (h) h.fill(0);
    if (u) u.fill(0);
    if (v) v.fill(0);
  }

  // --- 描画（法線ベクトルから疑似的な光の反射を計算し、水らしい質感を出す） ---
  const LIGHT = normalize3(0.45, 0.55, 0.85);
  const VIEW = [0, 0, 1];
  const HALF = normalize3(LIGHT[0] + VIEW[0], LIGHT[1] + VIEW[1], LIGHT[2] + VIEW[2]);

  function normalize3(x, y, z){
    const len = Math.sqrt(x * x + y * y + z * z) || 1;
    return [x / len, y / len, z / len];
  }

  const BASE = [22, 92, 138];     // 通常の水色
  const CREST = [140, 226, 235];  // 波の頂点（明るい）
  const TROUGH = [8, 30, 58];     // 波の谷（暗い）

  function render(){
    const normalScale = 6.0;
    let p = 0;
    for (let j = 0; j < H; j++){
      const jm = j > 0 ? j - 1 : j;
      const jp = j < H - 1 ? j + 1 : j;
      const rowH = j * W, rowHm = jm * W, rowHp = jp * W;
      for (let i = 0; i < W; i++){
        const im = i > 0 ? i - 1 : i;
        const ip = i < W - 1 ? i + 1 : i;
        const hc = h[rowH + i];
        const dhx = h[rowH + ip] - h[rowH + im];
        const dhy = h[rowHp + i] - h[rowHm + i];

        let nx = -dhx * normalScale;
        let ny = -dhy * normalScale;
        let nz = 1;
        const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
        nx /= len; ny /= len; nz /= len;

        const diffuse = Math.max(0, nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]);
        const specDot = Math.max(0, nx * HALF[0] + ny * HALF[1] + nz * HALF[2]);
        const spec = Math.pow(specDot, 42);

        const crestMix = Math.max(0, Math.min(1, hc * 2.2));
        const troughMix = Math.max(0, Math.min(1, -hc * 2.2));

        let r = BASE[0] + (CREST[0] - BASE[0]) * crestMix + (TROUGH[0] - BASE[0]) * troughMix;
        let g = BASE[1] + (CREST[1] - BASE[1]) * crestMix + (TROUGH[1] - BASE[1]) * troughMix;
        let b = BASE[2] + (CREST[2] - BASE[2]) * crestMix + (TROUGH[2] - BASE[2]) * troughMix;

        const shade = 0.45 + 0.65 * diffuse;
        r = r * shade + spec * 255;
        g = g * shade + spec * 235;
        b = b * shade + spec * 255;

        offData[p]     = r > 255 ? 255 : r;
        offData[p + 1] = g > 255 ? 255 : g;
        offData[p + 2] = b > 255 ? 255 : b;
        offData[p + 3] = 255;
        p += 4;
      }
    }
    offCtx.putImageData(offImage, 0, 0);
    ctx.drawImage(offCanvas, 0, 0, W, H, 0, 0, canvas.width, canvas.height);
  }

  // ---------------------------------------------------------------
  // 2. 端末の傾き（DeviceOrientation）取得
  // ---------------------------------------------------------------

  let targetTiltX = 0, targetTiltY = 0;
  let curTiltX = 0, curTiltY = 0;
  let orientationActive = false;

  function getScreenAngle(){
    if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
    if (typeof window.orientation === 'number') return window.orientation;
    return 0;
  }

  function onDeviceOrientation(e){
    if (e.gamma === null || e.beta === null) return;
    const angle = getScreenAngle();
    let gx = e.gamma; // 左右の傾き（-90〜90）
    let gy = e.beta;  // 前後の傾き（-180〜180）
    let x, y;
    if (angle === 90){        x = -gy; y = gx; }
    else if (angle === -90 || angle === 270){ x = gy;  y = -gx; }
    else if (angle === 180){  x = -gx; y = -gy; }
    else {                    x = gx;  y = gy; }

    const rad = Math.PI / 180;
    targetTiltX = clamp(Math.sin(x * rad), -1, 1) * TILT_GAIN;
    targetTiltY = clamp(Math.sin(y * rad), -1, 1) * TILT_GAIN;
  }

  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

  // デスクトップ用フォールバック：マウス位置を傾きとして扱う
  function onMouseMove(e){
    if (orientationActive) return;
    const rect = glassEl.getBoundingClientRect();
    const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    const ny = ((e.clientY - rect.top) / rect.height) * 2 - 1;
    targetTiltX = clamp(nx, -1, 1) * TILT_GAIN * 0.8;
    targetTiltY = clamp(ny, -1, 1) * TILT_GAIN * 0.8;
  }

  // ---------------------------------------------------------------
  // 3. 起動フロー（iOSはユーザー操作後に許可を要求する必要がある）
  // ---------------------------------------------------------------

  const needsPermission = typeof DeviceOrientationEvent !== 'undefined' &&
                           typeof DeviceOrientationEvent.requestPermission === 'function';
  const hasOrientation = typeof DeviceOrientationEvent !== 'undefined';

  if (needsPermission){
    startLabel.textContent = 'タップしてセンサーを許可';
    startDesc.textContent = 'iOSではモーションセンサーの利用に許可が必要です';
  } else if (hasOrientation){
    startLabel.textContent = 'タップして開始';
    startDesc.textContent = 'スマホを傾けると水面が揺れます';
  } else {
    startLabel.textContent = 'タップして開始';
    startDesc.textContent = 'マウスを動かして傾きをシミュレートします（PC）';
  }

  startBtn.addEventListener('click', function(){
    overlay.classList.add('hidden');
    addRipple(0.5, 0.5, 0.9, Math.round(Math.min(W, H) * 0.12) || 6);

    if (needsPermission){
      DeviceOrientationEvent.requestPermission().then(function(res){
        if (res === 'granted'){
          orientationActive = true;
          window.addEventListener('deviceorientation', onDeviceOrientation);
        }
      }).catch(function(){ /* 許可されなかった場合はマウス操作にフォールバック */ });
    } else if (hasOrientation){
      orientationActive = true;
      window.addEventListener('deviceorientation', onDeviceOrientation);
    }
  }, { once: true });

  window.addEventListener('mousemove', onMouseMove);

  // タップ / ドラッグで波紋を作る
  let dragging = false;
  function pointerToNorm(e){
    const rect = glassEl.getBoundingClientRect();
    const p = (e.touches && e.touches[0]) ? e.touches[0] : e;
    return [
      clamp((p.clientX - rect.left) / rect.width, 0, 1),
      clamp((p.clientY - rect.top) / rect.height, 0, 1)
    ];
  }
  glassEl.addEventListener('pointerdown', function(e){
    dragging = true;
    const [nx, ny] = pointerToNorm(e);
    addRipple(nx, ny, 0.85, Math.round(Math.min(W, H) * 0.09) || 5);
  });
  glassEl.addEventListener('pointermove', function(e){
    if (!dragging) return;
    const [nx, ny] = pointerToNorm(e);
    addRipple(nx, ny, 0.22, Math.round(Math.min(W, H) * 0.05) || 3);
  });
  window.addEventListener('pointerup', function(){ dragging = false; });

  resetBtn.addEventListener('click', resetWater);

  // ---------------------------------------------------------------
  // 4. メインループ
  // ---------------------------------------------------------------

  function frame(){
    curTiltX += (targetTiltX - curTiltX) * 0.12;
    curTiltY += (targetTiltY - curTiltY) * 0.12;

    for (let s = 0; s < SUBSTEPS; s++){
      physicsStep(DT, curTiltX, curTiltY);
    }
    render();

    tiltBadge.textContent = 'tilt: ' + curTiltX.toFixed(2) + ', ' + curTiltY.toFixed(2);
    requestAnimationFrame(frame);
  }

  let resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeAll, 150);
  });
  window.addEventListener('orientationchange', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeAll, 250);
  });

  initSim();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
