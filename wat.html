<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#07121c">
<title>Liquid Wallet</title>
<style>
* {
    box-sizing: border-box;
}
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}
body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
    background: #07121c;
    color: white;
    display: grid;
    place-items: center;
    touch-action: none;
}
.phone {
    position: relative;
    width: min(92vw, 430px);
    height: min(90vh, 860px);
    overflow: hidden;
    border-radius: 42px;
    background:
        radial-gradient(
            ellipse at 50% 100%,
            #0b3854 0%,
            #071019 58%
        );
    box-shadow:
        0 30px 90px #000b,
        inset 0 0 50px #ffffff08;
}
.info {
    position: absolute;
    z-index: 20;
    top: 38px;
    left: 28px;
    pointer-events: none;
}
.time {
    font-size: 48px;
    font-weight: 300;
    letter-spacing: -2px;
}
.date {
    font-size: 13px;
    opacity: 0.55;
    margin-top: 3px;
}
.balance {
    margin-top: 30px;
}
.label {
    font-size: 11px;
    letter-spacing: 0.18em;
    opacity: 0.5;
}
.money {
    font-size: 34px;
    font-weight: 500;
    margin-top: 4px;
}
.status {
    position: absolute;
    z-index: 30;
    right: 18px;
    top: 20px;
    font-size: 11px;
    color: #9eeaff;
    pointer-events: none;
}
#water {
    position: absolute;
    z-index: 2;
    left: -18%;
    bottom: -8%;
    width: 136%;
    height: 72%;
    overflow: hidden;
    transform-origin: 50% 100%;
    background:
        linear-gradient(
            180deg,
            #42d9f0cc 0%,
            #159bc9e8 22%,
            #0874afeF 55%,
            #03436ff7 100%
        );
    box-shadow:
        0 -12px 35px #48dfff45,
        inset 0 18px 35px #b9f8ff18;
    will-change: transform;
}
#water::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(
            ellipse at 50% 0%,
            #d9fbff2e 0%,
            transparent 42%
        ),
        linear-gradient(
            105deg,
            transparent 0%,
            #ffffff0b 35%,
            transparent 52%,
            #ffffff0a 72%,
            transparent 100%
        );
    mix-blend-mode: screen;
    pointer-events: none;
}
.surface {
    position: absolute;
    left: -8%;
    top: -34px;
    width: 116%;
    height: 82px;
    border-radius: 50%;
    background:
        radial-gradient(
            ellipse at 50% 100%,
            #d9fbff55 0%,
            #7cecff38 42%,
            transparent 72%
        );
    filter: blur(0.5px);
    will-change: transform;
}
.surface::before,
.surface::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
}
.surface::before {
    left: 2%;
    top: 31px;
    width: 96%;
    height: 34px;
    border-top: 2px solid #d9fbff9c;
    border-bottom: 1px solid #b9f7ff45;
    transform:
        rotate(-1deg)
        scaleX(1.02);
    filter: blur(0.35px);
}
.surface::after {
    left: 8%;
    top: 42px;
    width: 84%;
    height: 22px;
    border-top: 1px solid #ffffff55;
    transform:
        rotate(1.2deg)
        scaleX(0.98);
    filter: blur(0.7px);
}
.surface-highlight {
    position: absolute;
    left: 12%;
    top: 18px;
    width: 76%;
    height: 24px;
    border-radius: 50%;
    border-top: 2px solid #e8fdff66;
    filter: blur(1px);
}
.wave-layer {
    position: absolute;
    left: -10%;
    top: -18px;
    width: 120%;
    height: 100px;
    opacity: 0.55;
    background:
        repeating-radial-gradient(
            ellipse at 50% 100%,
            transparent 0 12px,
            #d5fbff18 13px 15px,
            transparent 16px 27px
        );
    mix-blend-mode: screen;
    filter: blur(1.2px);
    will-change: transform;
}
.ripple {
    position: absolute;
    left: 50%;
    top: 18px;
    width: 100px;
    height: 28px;
    transform:
        translateX(-50%)
        scale(0.25);
    border-radius: 50%;
    border:
        1px solid
        #d9fbff88;
    opacity: 0;
    pointer-events: none;
}
.ripple.active {
    animation:
        ripple 1.8s
        cubic-bezier(.15,.65,.35,1)
        forwards;
}
@keyframes ripple {
    0% {
        opacity: 0.75;
        transform:
            translateX(-50%)
            scale(0.25);
    }
    100% {
        opacity: 0;
        transform:
            translateX(-50%)
            scale(2.8);
    }
}
.coin {
    position: absolute;
    z-index: 8;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-weight: bold;
    color: #704a00;
    background:
        radial-gradient(
            circle at 32% 25%,
            #fffbd0 0%,
            #fff0a0 12%,
            #f6ca45 48%,
            #b4770d 82%,
            #704300 100%
        );
    border:
        2px solid
        #ffe993aa;
    box-shadow:
        0 7px 13px #00263f99,
        inset 2px 2px 4px #fff8b866,
        inset -3px -4px 5px #70430088;
    transition:
        transform 0.18s ease-out;
}
.coin::after {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    border:
        1px solid
        #fff2a866;
}
.c1 {
    width: 44px;
    height: 44px;
    left: 24%;
    bottom: 26%;
}
.c2 {
    width: 34px;
    height: 34px;
    left: 57%;
    bottom: 20%;
}
.c3 {
    width: 28px;
    height: 28px;
    left: 73%;
    bottom: 37%;
}
.glass {
    position: absolute;
    z-index: 15;
    inset: 0;
    border-radius: 42px;
    background:
        linear-gradient(
            115deg,
            #ffffff0b 0%,
            transparent 24%,
            transparent 72%,
            #ffffff05 100%
        );
    box-shadow:
        inset 0 0 55px #9befff0a,
        inset 0 1px 0 #ffffff12;
    pointer-events: none;
}
button {
    position: absolute;
    z-index: 30;
    bottom: 26px;
    left: 50%;
    transform:
        translateX(-50%);
    border: 0;
    border-radius: 99px;
    padding:
        11px
        17px;
    color: white;
    background: #0008;
    backdrop-filter:
        blur(10px);
    font-size: 13px;
}
.small {
    position: fixed;
    bottom: 8px;
    font-size: 11px;
    opacity: 0.45;
}
</style>
</head>
<body>
<div class="phone" id="phone">
<div class="info">
    <div
        class="time"
        id="time">
    </div>
    <div class="date">
        9月25日 · Liquid Wallet
    </div>
    <div class="balance">
        <div class="label">
            BALANCE
        </div>
        <div class="money">
            ¥12,480
        </div>
    </div>
</div>
<div id="water">
    <div class="wave-layer"></div>
    <div class="surface">
        <div class="surface-highlight"></div>
    </div>
    <div
        class="ripple"
        id="ripple">
    </div>
</div>
<div class="coin c1">
    ¥
</div>
<div class="coin c2">
    ¥
</div>
<div class="coin c3">
    ¥
</div>
<div class="glass"></div>
<div
    class="status"
    id="status">
    傾き 0°
</div>
<button id="motion">
    📱 傾きを有効にする
</button>
</div>
<div class="small">
    iPhone:
    ボタンを押して
    モーションセンサーを許可
</div>
<script>
const water =
    document.querySelector("#water");
const surface =
    document.querySelector(".surface");
const waveLayer =
    document.querySelector(".wave-layer");
const ripple =
    document.querySelector("#ripple");
const status =
    document.querySelector("#status");
const motion =
    document.querySelector("#motion");
const phone =
    document.querySelector("#phone");
const coins =
    [...document.querySelectorAll(".coin")];
let target = 0;
let angle = 0;
let velocity = 0;
let lastTime = performance.now();
let lastRippleTime = 0;
let dragging = false;
let startX = 0;
let lastPointerX = 0;
function clock() {
    const now = new Date();
    document.querySelector("#time")
        .textContent =
        now.toLocaleTimeString(
            "ja-JP",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );
}
clock();
setInterval(clock, 1000);
function triggerRipple() {
    const now = performance.now();
    if (now - lastRippleTime < 420) {
        return;
    }
    lastRippleTime = now;
    ripple.classList.remove("active");
    void ripple.offsetWidth;
    ripple.classList.add("active");
}
function animate(now) {
    const delta =
        Math.min(
            32,
            now - lastTime
        );
    lastTime = now;
    const dt =
        delta / 16.6667;
    const targetAngle =
        target * 0.72;
    const force =
        (targetAngle - angle) * 0.045;
    velocity += force * dt;
    const damping =
        Math.pow(0.86, dt);
    velocity *= damping;
    angle += velocity * dt;
    const visual =
        Math.max(
            -22,
            Math.min(
                22,
                angle
            )
        );
    const speed =
        Math.abs(velocity);
    const acceleration =
        Math.min(
            1,
            speed * 0.12
        );
    water.style.transform =
        `rotate(${visual}deg)`;
    surface.style.transform =
        `translate3d(${velocity * -1.8}px, ${Math.abs(velocity) * 0.35}px, 0)
         rotate(${velocity * -0.18}deg)
         scaleY(${1 + acceleration * 0.18})`;
    waveLayer.style.transform =
        `translate3d(${velocity * -3.5}px, 0, 0)
         rotate(${velocity * -0.12}deg)
         scaleY(${1 + acceleration * 0.35})`;
    coins.forEach((coin, index) => {
        const factor =
            0.35 +
            index * 0.12;
        coin.style.transform =
            `translate3d(${velocity * factor}px, ${Math.abs(velocity) * factor * 0.35}px, 0)
             rotate(${velocity * factor * 1.8}deg)`;
    });
    if (speed > 0.75) {
        triggerRipple();
    }
    status.textContent =
        `傾き ${Math.round(target)}°`;
    requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
function onOrientation(event) {
    if (
        event.gamma === null ||
        event.gamma === undefined
    ) {
        return;
    }
    const raw =
        Math.max(
            -45,
            Math.min(
                45,
                event.gamma
            )
        );
    target =
        target * 0.82 +
        raw * 0.18;
}
async function enableMotion() {
    try {
        if (
            typeof DeviceOrientationEvent
            === "undefined"
        ) {
            motion.textContent =
                "この端末ではセンサー非対応";
            return;
        }
        if (
            typeof DeviceOrientationEvent
                .requestPermission
            === "function"
        ) {
            const permission =
                await
                DeviceOrientationEvent
                    .requestPermission();
            if (
                permission !== "granted"
            ) {
                motion.textContent =
                    "センサー許可が必要です";
                return;
            }
        }
        window.addEventListener(
            "deviceorientation",
            onOrientation,
            true
        );
        motion.textContent =
            "✓ モーション有効";
    }
    catch (error) {
        console.error(error);
        motion.textContent =
            "センサーを利用できません";
    }
}
motion.addEventListener(
    "click",
    enableMotion
);
window.addEventListener(
    "keydown",
    event => {
        if (
            event.key === "ArrowLeft"
        ) {
            target =
                Math.max(
                    -45,
                    target - 5
                );
        }
        if (
            event.key === "ArrowRight"
        ) {
            target =
                Math.min(
                    45,
                    target + 5
                );
        }
        if (
            event.key === "ArrowUp" ||
            event.key === "ArrowDown"
        ) {
            target *= 0.88;
        }
    }
);
phone.addEventListener(
    "pointerdown",
    event => {
        if (
            event.target === motion
        ) {
            return;
        }
        dragging = true;
        startX =
            event.clientX;
        lastPointerX =
            event.clientX;
        phone.setPointerCapture?.(
            event.pointerId
        );
    }
);
phone.addEventListener(
    "pointermove",
    event => {
        if (!dragging) {
            return;
        }
        const movement =
            event.clientX -
            lastPointerX;
        lastPointerX =
            event.clientX;
        target =
            Math.max(
                -45,
                Math.min(
                    45,
                    target +
                    movement * 0.42
                )
            );
    }
);
phone.addEventListener(
    "pointerup",
    event => {
        dragging = false;
        phone.releasePointerCapture?.(
            event.pointerId
        );
    }
);
phone.addEventListener(
    "pointercancel",
    () => {
        dragging = false;
    }
);
</script>
</body>
</html>
